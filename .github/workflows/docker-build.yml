name: Docker Build & Push

# Déclencheurs : push ou pull request sur la branche master
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurer Docker Buildx (multi-architectures + cache avancé)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Se connecter à Docker Hub (uniquement sur push, pas sur PR)
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 4. Extraire les métadonnées (tags, labels) de l'image
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/todo-list-angular
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # 5. Construire et pousser l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Pousse uniquement sur les pushes vers main (pas sur les PR)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache les couches Docker via GitHub Actions Cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
